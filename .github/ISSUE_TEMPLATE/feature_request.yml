name: Feature request
description: Suggest an improvement and explain the capture workflow it would help.
title: "[Feature]: "
body:
  - type: markdown
    attributes:
      value: "Search existing requests first. Proposals are welcome; submitting one does not mean it is scheduled for a release."
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe a real workflow, who needs it, and what is difficult today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Explain what you would expect to see or do in Camly.
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Relevant platforms
      multiple: true
      options:
        - macOS
        - Windows
        - Linux (X11)
        - Linux (Wayland)
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives or workarounds
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Optional examples or mockups. Remove private information.
