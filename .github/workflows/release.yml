# Builds Camly installers for macOS (Apple Silicon + Intel), Windows and Linux.
# Push a tag like v1.1.0 → a draft is populated by matrix runners, then published as a
# public GitHub Release. Run it manually to (re)build some platforms for an existing tag.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to build (e.g. v1.1.0); its code is checked out'
        required: true
        default: 'v1.3.0'
      platforms:
        description: 'Platforms to build: all, or a comma list of macos,windows,linux'
        required: false
        default: 'all'

permissions:
  contents: write

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    outputs:
      include: ${{ steps.pick.outputs.include }}
    steps:
      - id: pick
        env:
          PLATFORMS: ${{ inputs.platforms || 'all' }}
        run: |
          # GitHub retired the Intel macos-13 runners; Intel is cross-built on Apple Silicon.
          # xcap → pipewire-rs 0.10 needs PipeWire ≥ 1.0 headers, so Linux needs 24.04+.
          all='[
            {"os":"macos","platform":"macos-latest","args":"--target aarch64-apple-darwin","rust_target":"aarch64-apple-darwin"},
            {"os":"macos","platform":"macos-latest","args":"--target x86_64-apple-darwin","rust_target":"x86_64-apple-darwin"},
            {"os":"windows","platform":"windows-latest","args":"","rust_target":"x86_64-pc-windows-msvc"},
            {"os":"linux","platform":"ubuntu-24.04","args":"","rust_target":"x86_64-unknown-linux-gnu"}
          ]'
          include=$(jq -c --arg p "${PLATFORMS// /}" \
            '[.[] | select($p == "all" or (.os as $o | $p | split(",") | index($o)))]' <<< "$all")
          if [ "$include" = "[]" ]; then echo "::error::No platform matches '$PLATFORMS'"; exit 1; fi
          echo "include=$include" >> "$GITHUB_OUTPUT"

  build:
    name: Build (${{ matrix.rust_target }})
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.include) }}
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: pnpm/action-setup@v4
        with:
          version: 8

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf \
            libxdo-dev libxcb1-dev libxrandr-dev libdbus-1-dev libpipewire-0.3-dev libclang-dev \
            libwayland-dev libegl-dev libgbm-dev libfuse2t64 file

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - name: Build native capture helper (macOS)
        if: runner.os == 'macOS'
        run: TARGET_TRIPLE=${{ matrix.rust_target }} bash scripts/build-recorder.sh

      - name: Bundle FFmpeg (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Invoke-WebRequest https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg
          New-Item -ItemType Directory -Force src-tauri/binaries | Out-Null
          Copy-Item (Get-ChildItem ffmpeg -Recurse -Filter ffmpeg.exe | Select-Object -First 1).FullName `
            src-tauri/binaries/ffmpeg-x86_64-pc-windows-msvc.exe

      # Optional secrets, used only when present so forks and fresh repos still build:
      #   TAURI_SIGNING_PRIVATE_KEY (+ _PASSWORD) → signed in-app updates (latest.json)
      #   APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD, APPLE_SIGNING_IDENTITY,
      #   APPLE_ID, APPLE_PASSWORD, APPLE_TEAM_ID → Developer ID signing + notarization, so
      #   macOS opens the downloaded app without any Gatekeeper warning.
      # Secrets are passed only to the build step's own env (never written to $GITHUB_ENV);
      # this step only records which ones exist.
      - name: Detect signing setup
        shell: bash
        env:
          HAS_UPDATER_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
          HAS_APPLE: ${{ secrets.APPLE_CERTIFICATE != '' && secrets.APPLE_CERTIFICATE_PASSWORD != '' && secrets.APPLE_SIGNING_IDENTITY != '' && secrets.APPLE_ID != '' && secrets.APPLE_PASSWORD != '' && secrets.APPLE_TEAM_ID != '' }}
        run: |
          if [ "$HAS_UPDATER_KEY" = "true" ]; then
            echo "Updates: signed"
          else
            echo "UPDATER_ARGS=--config src-tauri/tauri.no-updater.conf.json" >> "$GITHUB_ENV"
            echo "::warning::TAURI_SIGNING_PRIVATE_KEY is not set — this release can't be installed by in-app updates."
          fi
          if [ "$RUNNER_OS" = "macOS" ] && [ "$HAS_APPLE" = "true" ]; then
            echo "USE_APPLE_SIGNING=true" >> "$GITHUB_ENV"
            echo "macOS: Developer ID signing + notarization"
          elif [ "$RUNNER_OS" = "macOS" ]; then
            echo "::warning::Apple signing secrets are not set — the macOS app is ad-hoc signed and Gatekeeper will warn on first open."
          fi

      # tauri-action is pinned to a full commit (v0.6.2); Dependabot proposes newer ones.
      - name: Build and upload Tauri bundle (Apple-signed)
        if: env.USE_APPLE_SIGNING == 'true'
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # linuxdeploy's bundled strip can't read newer ELF sections and aborts the AppImage.
          NO_STRIP: "true"
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          tagName: ${{ inputs.tag || (github.ref_type == 'tag' && github.ref_name) || format('v1.0.{0}', github.run_number) }}
          releaseName: Camly ${{ inputs.tag || (github.ref_type == 'tag' && github.ref_name) || format('v1.0.{0}', github.run_number) }}
          releaseBody: "Download the installer for your system below. Camly 1.3+ also updates itself from Library → Updates."
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true
          args: ${{ matrix.args }} ${{ env.UPDATER_ARGS }}

      - name: Build and upload Tauri bundle
        if: env.USE_APPLE_SIGNING != 'true'
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NO_STRIP: "true"
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ inputs.tag || (github.ref_type == 'tag' && github.ref_name) || format('v1.0.{0}', github.run_number) }}
          releaseName: Camly ${{ inputs.tag || (github.ref_type == 'tag' && github.ref_name) || format('v1.0.{0}', github.run_number) }}
          releaseBody: "Download the installer for your system below. Camly 1.3+ also updates itself from Library → Updates."
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true
          args: ${{ matrix.args }} ${{ env.UPDATER_ARGS }}

  publish:
    name: Publish Release
    needs: build
    # Publish whatever platforms built; one failing platform shouldn't block the others.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Publish GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ inputs.tag || (github.ref_type == 'tag' && github.ref_name) || format('v1.0.{0}', github.run_number) }}"
          echo "Publishing release $TAG to make downloads publicly available..."
          gh release edit "$TAG" --draft=false --latest || {
            echo "Retrying without --latest flag..."
            gh release edit "$TAG" --draft=false || true
          }
          echo "Release $TAG published successfully!"
