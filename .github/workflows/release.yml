# Builds Camly installers for macOS (Apple Silicon + Intel), Windows and Linux.
# Push a tag like v1.0.0 (or run manually) → a draft is populated by matrix runners,
# then automatically published as a public GitHub Release with all platform installers.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release version tag (e.g. v1.0.0)'
        required: false
        default: 'v1.1.0'

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.rust_target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target aarch64-apple-darwin
            rust_target: aarch64-apple-darwin
          # GitHub retired the Intel macos-13 runners; cross-build Intel on Apple Silicon.
          - platform: macos-latest
            args: --target x86_64-apple-darwin
            rust_target: x86_64-apple-darwin
          - platform: windows-latest
            args: ""
            rust_target: x86_64-pc-windows-msvc
          - platform: ubuntu-22.04
            args: ""
            rust_target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 8

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf \
            libxdo-dev libxcb1-dev libxrandr-dev libdbus-1-dev libpipewire-0.3-dev \
            libwayland-dev libegl-dev libgbm-dev libfuse2 file

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - name: Build native capture helper (macOS)
        if: runner.os == 'macOS'
        run: TARGET_TRIPLE=${{ matrix.rust_target }} bash scripts/build-recorder.sh

      - name: Bundle FFmpeg (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Invoke-WebRequest https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg
          New-Item -ItemType Directory -Force src-tauri/binaries | Out-Null
          Copy-Item (Get-ChildItem ffmpeg -Recurse -Filter ffmpeg.exe | Select-Object -First 1).FullName `
            src-tauri/binaries/ffmpeg-x86_64-pc-windows-msvc.exe

      - name: Build and upload Tauri bundle
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # linuxdeploy's bundled strip can't read newer ELF sections and aborts the AppImage.
          NO_STRIP: "true"
        with:
          tagName: ${{ inputs.tag || (github.ref_type == 'tag' && github.ref_name) || format('v1.0.{0}', github.run_number) }}
          releaseName: Camly ${{ inputs.tag || (github.ref_type == 'tag' && github.ref_name) || format('v1.0.{0}', github.run_number) }}
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

  publish:
    name: Publish Release
    needs: build
    # Publish whatever platforms built; one failing platform shouldn't block the others.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Publish GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ inputs.tag || (github.ref_type == 'tag' && github.ref_name) || format('v1.0.{0}', github.run_number) }}"
          echo "Publishing release $TAG to make downloads publicly available..."
          gh release edit "$TAG" --draft=false --latest || {
            echo "Retrying without --latest flag..."
            gh release edit "$TAG" --draft=false || true
          }
          echo "Release $TAG published successfully!"
